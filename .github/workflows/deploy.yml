name: farida

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build Angular App
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.9.0'

    - name: Install Dependencies
      run: npm install --force

    - name: Build Angular App
      run: npm run build

    - name: Create .htaccess
      run: |
        echo "RewriteEngine On" > dist/e-learning/browser/.htaccess
        echo "RewriteBase /" >> dist/e-learning/browser/.htaccess
        echo "RewriteRule ^index\.html$ - [L]" >> dist/e-learning/browser/.htaccess
        echo "RewriteCond %{REQUEST_FILENAME} !-f" >> dist/e-learning/browser/.htaccess
        echo "RewriteCond %{REQUEST_FILENAME} !-d" >> dist/e-learning/browser/.htaccess
        echo "RewriteRule . index.html [L]" >> dist/e-learning/browser/.htaccess

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: angular-build
        path: dist/e-learning/browser

  deploy:
    name: Deploy to ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: steps-node-1
            host: SSH_HOST_NODE_1
          - name: steps-node-2
            host: SSH_HOST_NODE_2
          - name: steps-node-3
            host: SSH_HOST_NODE_3
          - name: steps-node-4
            host: SSH_HOST_NODE_4

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: angular-build
        path: angular-build

    - name: Set Host IP from secret
      id: get_host
      run: echo "host_ip=${{ secrets[matrix.host] }}" >> $GITHUB_OUTPUT

    - name: Deploy files via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ steps.get_host.outputs.host_ip }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        source: "angular-build/*"
        target: "/var/www/html/steps-front-deploying"

    - name: Finalize deployment on remote
      uses: appleboy/ssh-action@master
      with:
        host: ${{ steps.get_host.outputs.host_ip }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        script: |
          mv /var/www/html/steps-front-deploying/angular-build /var/www/html/steps-front-deployed
          rm -rf /var/www/html/steps-front-deploying
          # Backup current
          if [ -d "/var/www/html/steps-front" ]; then
            rm -rf /var/www/html/steps-front-backup
            mv /var/www/html/steps-front /var/www/html/steps-front-backup
          fi

          # Move new build into place
          mv /var/www/html/steps-front-deployed /var/www/html/steps-front

    - name: Discord Notification on Failure
      if: ${{ failure() }}
      uses: Ilshidur/action-discord@master
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      with:
        args: ':red_circle: Deployment **failed** to **`${{ matrix.name }}`**. CC: **`${{ github.actor }}`**.'
