name: farida

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build Angular App
    runs-on: ubuntu-latest

    outputs:
      build_path: ${{ steps.set-path.outputs.build_path }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.9.0'

    - name: Install Dependencies
      run: npm install --force

    - name: Build Angular App
      run: npm run build

    - name: Create .htaccess
      run: |
        echo "RewriteEngine On" > dist/e-learning/browser/.htaccess
        echo "RewriteBase /" >> dist/e-learning/browser/.htaccess
        echo "RewriteRule ^index\.html$ - [L]" >> dist/e-learning/browser/.htaccess
        echo "RewriteCond %{REQUEST_FILENAME} !-f" >> dist/e-learning/browser/.htaccess
        echo "RewriteCond %{REQUEST_FILENAME} !-d" >> dist/e-learning/browser/.htaccess
        echo "RewriteRule . index.html [L]" >> dist/e-learning/browser/.htaccess

    - name: Set build path
      id: set-path
      run: echo "build_path=dist/e-learning/browser" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: steps-node-2
            host: HOST_NODE_2
          - name: steps-node-3
            host: HOST_NODE_3
          - name: steps-node-4
            host: HOST_NODE_4

    steps:
    - name: Upload to temporary folder
      uses: appleboy/scp-action@master
        
    - name: Set Host IP from secret
      id: get_host
      run: |
        echo "host_ip=${{ secrets[matrix.host] }}" >> $GITHUB_OUTPUT
        
    - name: Deploy to ${{ matrix.name }}
      uses: appleboy/ssh-action@master  
      with:
        host: ${{ steps.get_host.outputs.host_ip }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        source: "dist/e-learning/browser/*"
        target: "/var/www/html/steps-front-deploying"

    - name: Finalize deployment
      uses: appleboy/ssh-action@master
      with:
        host: ${{ steps.get_host.outputs.host_ip }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        script: |
          mv /var/www/html/steps-front-deploying/dist/e-learning/browser /var/www/html/steps-front-deployed
          rm -rf /var/www/html/steps-front-deploying
          # Make backup of current app if it exists
          if [ -d "/var/www/html/steps-front" ]; then
            rm -rf /var/www/html/steps-front-backup
            mv /var/www/html/steps-front /var/www/html/steps-front-backup
          fi

          # Move the new build into place
          mv /var/www/html/steps-front-deployed /var/www/html/steps-front

    - name: Discord Notification
      if: ${{ success() }}
      uses: Ilshidur/action-discord@master
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      with:
        args: ':green_circle: The project **`${{ github.repository }}`** has been safely deployed by **`${{ github.actor }}`**.'

    - name: Discord Notification (The job has failed)
      if: ${{ failure() }}
      uses: Ilshidur/action-discord@master
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      with:
        args: ':red_circle: Deployment **failed** for project **`${{ github.repository }}`**. Old version is still active. CC: **`${{ github.actor }}`**.'
