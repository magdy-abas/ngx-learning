<ng-container>
  <div class="container">
    <div data-aos="fade-up" class="aos-init banner-wrapper">
      @for (data of bannerData; track $index) {
      <div class="image-container ">
        <img class="img-fluid " [src]="data.image" [alt]="data.title">
      </div>
      }
    </div>
  </div>
</ng-container>
