<section class="topcategory-sec">
  <div class="container">
    <div class="header-two-title text-center" data-aos="fade-up">
      <p class="tagline">{{ categoriesShortTitle }}</p>
      <h2>{{ categoriesTitle }}</h2>
    </div>

    <div class="top-category-group">
      <div class="row" [ngClass]="{ 'justify-content-center': categoriesData.length < 4 }">

        <div class="col-xl-3 col-lg-4 col-md-4 col-sm-6 d-flex" *ngFor="let data of categoriesData" data-aos="fade-down"
          (click)="onCategoryClick(data)">
          <div class="categories-item flex-fill">
            <div class="categories-icon">
              <img class="rounded-circle" [src]="data.image || '../../../../../assets/img/universty-placeholder.png'"
                onerror="this.src='../../../../../assets/img/universty-placeholder.png'" [alt]="data.title" />
            </div>
            <div class="categories-content">
              <h3>{{ data.title }}</h3>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
