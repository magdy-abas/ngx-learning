<!-- Top Categories -->
<section class="topcategory-sec">
  <div class="container">
    <div class="header-two-title text-center" data-aos="fade-up">
      <p class="tagline">Favourite Course</p>
      <h2>Top Category</h2>
      <div class="header-two-text">
        <p class="mb-0">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Eget aenean accumsan bibendum gravida
          maecenas augue elementum et neque. Suspendisse imperdiet.</p>
      </div>
    </div>
    <div class="top-category-group">
      <div class="row">

        <div class="col-xl-3 col-lg-6 col-md-6 col-sm-12 d-flex" data-aos="fade-down"
          *ngFor="let data of categoriesData">
          <div class="categories-item flex-fill">
            <div class="categories-icon">
              <img style="width: 50px;" class="rounded-circle" [src]="data.image" [alt]="data.title">
            </div>
            <div class="categories-content">
              <h3>{{data.title}}</h3>
              <p>50 Instructors</p>
            </div>
          </div>
        </div>


      </div>
    </div>
    <!-- View all Category -->
    <div class="col-lg-12">
      <div class="more-details text-center" data-aos="fade-down">
        <a class="discover-btn">View all Category <i class="fas fa-arrow-right ms-2"></i></a>
      </div>
    </div>
    <!-- /View all Category -->
  </div>
</section>
<!-- /Top Categories -->
