<!-- Feature Instructors -->
<div class="container">
  <div class="aos" data-aos="fade-up">
    <owl-carousel-o [options]="customOptions">
      @for (slider of sliderData; track $index) {
      <ng-template carouselSlide>
        <img [src]="slider.image" [alt]="slider.title" class="responsive-img">
      </ng-template>
      }
    </owl-carousel-o>



    <div id="carousel-custom-dots" class="owl-dots">
    </div>
  </div>
</div>


<!-- /Feature Instructors -->
