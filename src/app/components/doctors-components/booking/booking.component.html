<!-- Main Wrapper -->
<div class="main-wrapper instructor-profile-cst">

  <!-- Doctor Info -->
  <div class="instructor-bg-blk py-4">
    <div class="container">
      <div class="row">
        <div class="col-md-12 col-12">
          <div class="profile-info-blk text-center">
            <a href="javascript:;" class="profile-info-img" style="overflow: hidden;">
              <img src='./assets/img/course/doctor.png' alt="Doctor Image" class="img-fluid">
            </a>
            <h4><a href="javascript:;" style="cursor: text;">mahmoud</a></h4>


            <ul class="list-unstyled inline-inline profile-info-social">
              <li class="list-inline-item">
                <a><i class="fa-brands fa-facebook mx-1 fs-5"></i></a>
              </li>
              <li class="list-inline-item">
                <a><i class="fa-brands fa-telegram mx-1 fs-5"></i></a>
              </li>
              <li class="list-inline-item">
                <a><i class="fa-solid fa-phone-volume mx-1 fs-5"></i></a>
              </li>
              <li class="list-inline-item">
                <a><i class="fa-brands fa-whatsapp mx-1 fs-5"></i></a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- /Doctor Info -->

  <!-- Booking Section -->
  <section class="page-content-booking mt-2 pb-4 course-sec doctor-profile">
    <div class="container">
      <div class="row">

        <!-- Booking Header -->
        <div
          class="booking-header d-flex justify-content-between align-items-center p-3 mb-4 rounded-4  shadow-sm flex-wrap">

          <!-- Nearest Time -->
          <div class="d-flex align-items-center gap-3 ">
            <div class="icon-wrap  ">
              <svg width="20px" height="20px" class="icons text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="1.5"
                  d="M8 2v3M16 2v3M3.5 9.09h17M21 8.5V17c0 3-1.5 5-5 5H8c-3.5 0-5-2-5-5V8.5c0-3 1.5-5 5-5h8c3.5 0 5 2 5 5z">
                </path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M11.995 13.7h.01M8.294 13.7h.01M8.294 16.7h.01"></path>
              </svg>
            </div>
            <div>
              <small class="text-muted d-block">Nearest Time</small>
              <strong>19 Aug 2025 08:00AM-09:30AM</strong>
            </div>
          </div>

          <!-- Hourly Charge -->
          <div class="d-flex align-items-center gap-3">
            <div class="icon-wrap ">
              <svg width="20px" height="20px" class="icons text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="1.5"
                  d="M19.3 7.92v5.15c0 3.08-1.76 4.4-4.4 4.4H6.11c-.45 0-.88-.04-1.28-.13-.25-.04-.49-.11-.71-.19-1.5-.56-2.41-1.86-2.41-4.08V7.92c0-3.08 1.76-4.4 4.4-4.4h8.79c2.24 0 3.85.95 4.28 3.12.07.4.12.81.12 1.28z">
                </path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="1.5"
                  d="M22.301 10.92v5.15c0 3.08-1.76 4.4-4.4 4.4h-8.79c-.74 0-1.41-.1-1.99-.32-1.19-.44-2-1.35-2.29-2.81.4.09.83.13 1.28.13h8.79c2.64 0 4.4-1.32 4.4-4.4V7.92c0-.47-.04-.89-.12-1.28 1.9.4 3.12 1.74 3.12 4.28z">
                </path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="1.5"
                  d="M10.498 13.14a2.64 2.64 0 100-5.28 2.64 2.64 0 000 5.28zM4.78 8.3v4.4M16.222 8.3v4.4"></path>
              </svg>
            </div>
            <div>
              <small class="text-muted d-block">Hourly Charge</small>
              <strong>200</strong>
            </div>
          </div>

          <!-- In-Person Charge -->
          <div class="d-flex align-items-center gap-3">
            <div class="icon-wrap ">
              <svg width="20px" height="20px" class="icons text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-width="1.5" d="M12 13.43a3.12 3.12 0 100-6.24 3.12 3.12 0 000 6.24z"></path>
                <path stroke-width="1.5"
                  d="M3.62 8.49c1.97-8.66 14.8-8.65 16.76.01 1.15 5.08-2.01 9.38-4.78 12.04a5.193 5.193 0 01-7.21 0c-2.76-2.66-5.92-6.97-4.77-12.05z">
                </path>
              </svg>
            </div>
            <div>
              <small class="text-muted d-block">In-Person Charge</small>
              <strong>Free</strong>
            </div>
          </div>

          <!-- Group Meeting Charge -->
          <div class="d-flex align-items-center gap-3">
            <div class="icon-wrap ">
              <svg width="20px" height="20px" class="icons text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M9.16 10.87c-.1-.01-.22-.01-.33 0a4.42 4.42 0 01-4.27-4.43C4.56 3.99 6.54 2 9 2a4.435 4.435 0 01.16 8.87zM16.41 4c1.94 0 3.5 1.57 3.5 3.5 0 1.89-1.5 3.43-3.37 3.5a1.13 1.13 0 00-.26 0M4.16 14.56c-2.42 1.62-2.42 4.26 0 5.87 2.75 1.84 7.26 1.84 10.01 0 2.42-1.62 2.42-4.26 0-5.87-2.74-1.83-7.25-1.83-10.01 0zM18.34 20c.72-.15 1.4-.44 1.96-.87 1.56-1.17 1.56-3.1 0-4.27-.55-.42-1.22-.7-1.93-.86">
                </path>
              </svg>
            </div>
            <div>
              <small class="text-muted d-block">Group Meeting Charge</small>
              <strong>Free/Seat</strong>
            </div>
          </div>
        </div>


        <!-- Calendar + Time Slots -->
        <div class="booking-card shadow-sm rounded-4  p-4">
          <div class="row">
            <!-- Calendar -->
            <div class="col-lg-6 col-md-12 mb-4 mb-lg-0 border-end">
              <div class="theme-custom mx-auto">
                <bs-datepicker-inline [(ngModel)]="selectedDate" [bsConfig]="bsConfig" [minDate]="minDate"
                  [maxDate]="maxDate" [datesEnabled]="availableDates">
                </bs-datepicker-inline>
              </div>
            </div>

            <!-- Time Slots -->
            <div class="col-lg-6 col-md-12 d-flex flex-column">
              <h6 class="fw-bold mb-3">
                Available times for {{ selectedDate | date: 'dd MMMM yyyy' }}
              </h6>
              <div class="time-slots">
                <button *ngFor="let slot of timeSlots" class="slot-btn" [class.active]="selectedTime === slot.value"
                  (click)="selectedTime = slot.value">
                  {{ slot.label }}
                </button>
              </div>
              <button class="btn btn-primary w-100 mt-auto" (click)="proceedBooking()">
                Proceed with Booking
              </button>
            </div>
          </div>

        </div>
        <!-- /Calendar + Time Slots -->

      </div>
    </div>
  </section>
  <!-- /Booking Section -->

</div>
