<!-- Main Wrapper -->
<div class="main-wrapper log-wrap">
  <div class="row">
    <!-- Login Banner -->
    <div class="col-md-6 login-bg">
      <div class="row w-100">
        <div class="col-md-12">
          <owl-carousel-o [options]="registerOwlOptions">
            <ng-container *ngFor="let slide of welcomeLogin">
              <ng-template carouselSlide>
                <div class="welcome-login">
                  <div class="login-banner">
                    <img [src]="slide.img" class="img-fluid" alt="Logo" />
                  </div>
                  <div class="mentor-course text-center">
                    <h2>{{ slide.content1 }}<br />{{ slide.content2 }}</h2>
                    <p>{{ slide.paragraph }}</p>
                  </div>
                </div>
              </ng-template>
            </ng-container>
          </owl-carousel-o>
        </div>
      </div>
    </div>
    <!-- /Login Banner -->

    <div class="col-md-6 login-wrap-bg ">
      <!-- Login -->
      <div class="login-wrapper">
        <div class="loginbox">
          <div class="img-logo">
            <img [src]="logoUrl" class="img-fluid logo" alt="Logo">
            <div class="back-home">
              <a [routerLink]="routes.home">{{ 'auth.backToHome' | translate }}</a>
            </div>
          </div>
          <h1>{{ 'auth.signUp' | translate }}</h1>
          @if (msgError) {
          <div class="alert alert-danger mt-1">
            <p class="m-0">{{ msgError }}</p>
          </div>
          }

          <form [formGroup]="regForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
              <label class="form-control-label">{{ 'auth.fullName' | translate }}</label>
              <input type="text" class="form-control " formControlName="name"
                [placeholder]="'auth.namePlaceholder' | translate" [ngClass]="{
                  ' border-success': isFieldValid('name'),
                  ' border-danger': isFieldInvalid('name')
                }" />
              <div>
                <app-alert-error controlName="name" [formName]="regForm" />
              </div>
            </div>
            <div class="form-group">
              <label class="form-control-label">{{ 'auth.email' | translate }}</label>
              <input type="email" class="form-control " formControlName="email"
                [placeholder]="'auth.emailPlaceholder' | translate" [ngClass]="{
                  ' border-success': isFieldValid('email'),
                  ' border-danger': isFieldInvalid('email')
                }" />
              <div>
                <app-alert-error controlName="email" [formName]="regForm" />
              </div>
            </div>

            <app-phone-input [formGroup]="regForm" controlName="phone"></app-phone-input>

            <div class="form-group">
              <label class="form-control-label">{{ 'auth.password' | translate }}</label>
              <div class="pass-group" id="passwordInput">
                <input [type]="password" class="form-control pass-input"
                  [placeholder]="'auth.passwordPlaceholder' | translate" formControlName="password"
                  (input)="onChangePassword()" [ngClass]="{
                    'border-success': isFieldValid('password'),
                    'border-danger': isFieldInvalid('password')
                  }" />
                <div>
                  <app-alert-error controlName="password" [formName]="regForm" />
                </div>
                <span><i-feather name="eye" class="toggle-password feather-eye" (click)="onClick()"
                    *ngIf="show"></i-feather></span>
                <span><i-feather name="check" class="pass-checked" [ngClass]="{
                      active: passwordResponce.passwordResponceKey === '3'
                    }"></i-feather></span>
                <span><i-feather name="eye-off" class="toggle-password feather-eye-off" (click)="onClick()"
                    *ngIf="!show"></i-feather></span>
              </div>
              <div class="password-strength" [ngClass]="{
                  'poor-active': passwordResponce.passwordResponceKey === '0',
                  'avg-active': passwordResponce.passwordResponceKey === '1',
                  'strong-active': passwordResponce.passwordResponceKey === '2',
                  'heavy-active': passwordResponce.passwordResponceKey === '3'
                }" id="passwordStrength">
                <span id="poor" class="active"></span>
                <span id="weak" class="active"></span>
                <span id="strong" class="active"></span>
                <span id="heavy" class="active"></span>
              </div>
              <div id="passwordInfo" [ngClass]="{
                  weak: passwordResponce.passwordResponceKey === '0',
                  average: passwordResponce.passwordResponceKey === '1',
                  good: passwordResponce.passwordResponceKey === '2',
                  great: passwordResponce.passwordResponceKey === '3'
                }">
                <img [src]="passwordResponce.passwordResponceImage" />
                {{ passwordResponce.passwordResponceText }}
              </div>
            </div>
            <div class="form-check remember-me">
              <label class="form-check-label mb-0">
                <input class="form-check-input input-box-auth" type="checkbox" name="remember" />
                {{ 'auth.termsOfService' | translate }}
                <a [routerLink]="routes.page_term_condition">{{ 'auth.termsOfService' | translate }}</a> {{ 'auth.and' |
                translate }}
                <a [routerLink]="routes.page_privacy_policy">{{ 'auth.privacyPolicy' | translate }}</a>.
              </label>
            </div>

            <div class="d-grid">
              <button class="btn btn-primary btn-start" type="submit">
                {{ 'auth.createAccount' | translate }}
              </button>
            </div>
          </form>
        </div>
        <div class="google-bg text-center">

          <div class="sign-google">

          </div>
          <p class="mb-0">
            {{ 'auth.newUser' | translate }} <a routerLink="/signup">{{ 'auth.createAccount' | translate }}</a>
          </p>
        </div>
      </div>
      <!-- /Login -->
    </div>
  </div>
</div>
<!-- /Main Wrapper -->
