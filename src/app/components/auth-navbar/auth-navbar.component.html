<!-- auth-navbar.component.html -->
<header class="header header-two" [ngClass]="{
  'menu-opened': isMenuOpened,
  'header-page': !isHomePage ||
                 base === 'blog' ||
                 page === 'notifications' ||
                 page === 'faq' ||
                 page === 'pricing-plan' ||
                 page === 'wishlist' ||
                 page === 'support' ||
                 page === 'job-category' ||
                 page === 'term-condition' ||
                 page === 'privacy-policy' ||
                 page === 'help-center' ||
                 page === 'pricing-plan2'
}">
  <div class="header-fixed">
    <nav class="navbar navbar-expand-lg header-nav scroll-sticky" [ngClass]="{
      'add-header-bg': white_bg === true
    }">
      <div class="container">
        <div class="navbar-header">
          <a (click)="toggleSidebar()" id="mobile_btn" href="javascript:;">
            <span class="bar-icon">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </a>
          <a routerLink="/home" class="navbar-brand logo">
            <img src="assets/img/logo.svg" class="img-fluid" alt="Logo" />
          </a>
        </div>
        <div class="main-menu-wrapper">
          <div class="menu-header">
            <a routerLink="/home" class="menu-logo">
              <img src="assets/img/logo.svg" class="img-fluid" alt="Logo" />
            </a>
            <a (click)="hideSidebar()" class="menu-close" href="javascript:;">
              <i class="fas fa-times"></i>
            </a>
          </div>
          <ul class="main-nav">
            <ng-container *ngFor="let mainMenus of sidebar">
              <li class="has-submenu " *ngIf="mainMenus.separateRoute" [class.active]="isMainMenuActive(mainMenus)">
                <a [routerLink]="mainMenus.route">{{ mainMenus.tittle }}</a>
              </li>

              <li *ngIf="!mainMenus.separateRoute" class="has-submenu menu-effect"
                [class.active]="isMainMenuActive(mainMenus)">
                <a href="javascript:;" (click)="mainMenus.showAsTab = !mainMenus.showAsTab">
                  {{ mainMenus.tittle }}
                  <i class="fas fa-chevron-down"></i>
                </a>
                <ul class="submenu" [ngClass]="{'show-sub-menu': mainMenus.showAsTab}">
                  <ng-container *ngFor="let menu of mainMenus.menu">
                    <li *ngIf="!menu.hasSubRoute" [class.active]="isSubmenuActive(menu)">
                      <a [routerLink]="menu.route">{{ menu.menuValue }}</a>
                    </li>

                    <li *ngIf="menu.hasSubRoute" class="has-submenu" [class.active]="isSubmenuActive(menu)">
                      <a (click)="menu.showSubRoute = !menu.showSubRoute" [routerLink]="menu.route">
                        {{ menu.menuValue }}
                      </a>
                      <ul class="submenu" [ngClass]="{'show-sub-menu': menu.showSubRoute}">
                        <li *ngFor="let subMenu of menu.subMenus" [class.active]="isSubSubmenuActive(subMenu)">
                          <a [routerLink]="subMenu.route">{{ subMenu.menuValue }}</a>
                        </li>
                      </ul>
                    </li>
                  </ng-container>
                </ul>
              </li>
            </ng-container>
            <li class="login-link">
              <a>Login / Signup</a>
            </li>
          </ul>
        </div>
        <ul class="nav header-navbar-rht">
          <li class="nav-item">
            <a class="login-head button" routerLink="login">Login</a>
          </li>
          <li class="nav-item">
            <a class="signin-head" routerLink="signup">Sign up</a>
          </li>
        </ul>
      </div>
    </nav>
  </div>
</header>
